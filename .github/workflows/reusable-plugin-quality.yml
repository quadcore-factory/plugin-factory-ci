name: Reusable plugin quality

on:
  workflow_call:
    inputs:
      php-version:
        description: PHP version supported by the plugin (for example, 8.3).
        required: false
        type: string
        default: '8.3'
      working-directory:
        description: Directory containing composer.json, relative to the repository root.
        required: false
        type: string
        default: .
      php-extensions:
        description: Comma-separated extensions to build into the PHP image.
        required: false
        type: string
        default: mbstring,xml,zip
      run-lint:
        description: Run the configured lint Composer script.
        required: false
        type: boolean
        default: true
      run-tests:
        description: Run the configured test Composer script.
        required: false
        type: boolean
        default: true
      lint-script:
        description: Composer script name used for linting.
        required: false
        type: string
        default: lint
      test-script:
        description: Composer script name used for tests.
        required: false
        type: string
        default: test
      composer-dev:
        description: Install Composer development dependencies.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  quality:
    name: PHP ${{ inputs['php-version'] }} quality
    runs-on: ubuntu-latest
    container: php:${{ inputs['php-version'] }}-cli-bookworm
    env:
      COMPOSER_CACHE_DIR: ${{ github.workspace }}/.composer-cache
      WORKING_DIRECTORY: ${{ inputs['working-directory'] }}
      PHP_EXTENSIONS: ${{ inputs['php-extensions'] }}
      PHP_VERSION: ${{ inputs['php-version'] }}
      RUN_LINT: ${{ inputs['run-lint'] }}
      RUN_TESTS: ${{ inputs['run-tests'] }}
      LINT_SCRIPT: ${{ inputs['lint-script'] }}
      TEST_SCRIPT: ${{ inputs['test-script'] }}
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate workflow paths
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$WORKING_DIRECTORY" || "$WORKING_DIRECTORY" == /* || "$WORKING_DIRECTORY" == *$'\n'* || "$WORKING_DIRECTORY" == *'//' || "$WORKING_DIRECTORY" == */ || "$WORKING_DIRECTORY" =~ (^|/)\.\.(/|$) || ! "$WORKING_DIRECTORY" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "working-directory must be a non-empty relative path without traversal segments: $WORKING_DIRECTORY" >&2
            exit 1
          fi
          resolved_directory="$(realpath -m -- "$GITHUB_WORKSPACE/$WORKING_DIRECTORY")"
          case "$resolved_directory" in
            "$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*) ;;
            *) echo "working-directory resolves outside GITHUB_WORKSPACE" >&2; exit 1 ;;
          esac
          [[ -d "$resolved_directory" ]] || { echo "working-directory does not exist: $WORKING_DIRECTORY" >&2; exit 1; }

      - name: Install PHP extensions and Composer
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --no-install-recommends -y \
            ca-certificates \
            curl \
            git \
            libicu-dev \
            libonig-dev \
            libxml2-dev \
            libzip-dev \
            unzip
          curl -fsSL https://getcomposer.org/installer -o /tmp/composer-setup.php
          expected_checksum="$(curl -fsSL https://composer.github.io/installer.sig)"
          actual_checksum="$(php -r 'echo hash_file("sha384", "/tmp/composer-setup.php");')"
          if [[ "$expected_checksum" != "$actual_checksum" ]]; then
            echo 'Composer installer checksum verification failed' >&2
            exit 1
          fi
          php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
          rm /tmp/composer-setup.php
          IFS=',' read -r -a requested_extensions <<< "$PHP_EXTENSIONS"
          extensions=()
          for extension in "${requested_extensions[@]}"; do
            extension="${extension//[[:space:]]/}"
            if [[ -n "$extension" ]]; then
              if [[ ! "$extension" =~ ^[a-z0-9_+-]+$ ]]; then
                echo "Invalid PHP extension name: $extension" >&2
                exit 1
              fi
              case "$extension" in
                mbstring|xml|zip|intl|bcmath|pdo_mysql|mysqli|opcache|sockets|pcntl) ;;
                *)
                  echo "Unsupported PHP extension '$extension'. Supported extensions: mbstring, xml, zip, intl, bcmath, pdo_mysql, mysqli, opcache, sockets, pcntl." >&2
                  exit 1
                  ;;
              esac
              extensions+=("$extension")
            fi
          done
          if ((${#extensions[@]})); then
            docker-php-ext-install "${extensions[@]}"
          fi

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.composer-cache
          key: composer-${{ runner.os }}-php-${{ inputs['php-version'] }}-${{ hashFiles(format('{0}/composer.lock', inputs['working-directory'])) }}
          restore-keys: |
            composer-${{ runner.os }}-php-${{ inputs['php-version'] }}-

      - name: Validate Composer metadata
        run: cd "$WORKING_DIRECTORY" && composer validate --strict --check-lock

      - name: Install Composer dependencies with development packages
        if: ${{ inputs['composer-dev'] }}
        run: cd "$WORKING_DIRECTORY" && composer install --no-interaction --prefer-dist --no-progress

      - name: Install production Composer dependencies
        if: ${{ !inputs['composer-dev'] }}
        run: cd "$WORKING_DIRECTORY" && composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Run lint gate
        if: ${{ inputs['run-lint'] }}
        shell: bash
        env:
          REQUESTED_SCRIPT: ${{ inputs['lint-script'] }}
        run: |
          set -euo pipefail
          cd "$WORKING_DIRECTORY"
          if [[ ! "$REQUESTED_SCRIPT" =~ ^[A-Za-z0-9_.:-]+$ ]]; then
            echo "Invalid lint Composer script name: $REQUESTED_SCRIPT" >&2
            exit 1
          fi
          # shellcheck disable=SC2016
          php -r '$data = json_decode(file_get_contents("composer.json"), true); $name = $argv[1] ?? ""; exit(isset($data["scripts"][$name]) ? 0 : 1);' "$REQUESTED_SCRIPT" || {
            echo "Requested lint Composer script is missing: $REQUESTED_SCRIPT" >&2
            exit 1
          }
          composer run-script --if-present "$REQUESTED_SCRIPT"

      - name: Run test gate
        if: ${{ inputs['run-tests'] }}
        shell: bash
        env:
          REQUESTED_SCRIPT: ${{ inputs['test-script'] }}
        run: |
          set -euo pipefail
          cd "$WORKING_DIRECTORY"
          if [[ ! "$REQUESTED_SCRIPT" =~ ^[A-Za-z0-9_.:-]+$ ]]; then
            echo "Invalid test Composer script name: $REQUESTED_SCRIPT" >&2
            exit 1
          fi
          # shellcheck disable=SC2016
          php -r '$data = json_decode(file_get_contents("composer.json"), true); $name = $argv[1] ?? ""; exit(isset($data["scripts"][$name]) ? 0 : 1);' "$REQUESTED_SCRIPT" || {
            echo "Requested test Composer script is missing: $REQUESTED_SCRIPT" >&2
            exit 1
          }
          composer run-script --if-present "$REQUESTED_SCRIPT"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Plugin quality'
            echo
            echo "- PHP: \`$PHP_VERSION\`"
            echo "- Directory: \`$WORKING_DIRECTORY\`"
            echo "- Lint gate: \`$RUN_LINT\` (\`$LINT_SCRIPT\`)"
            echo "- Test gate: \`$RUN_TESTS\` (\`$TEST_SCRIPT\`)"
          } >> "$GITHUB_STEP_SUMMARY"
